
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090f">
  <title>Vix AI</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #09090f;
      color: #f5f5f7;
      min-height: 100vh;
    }

    .app {
      max-width: 900px;
      height: 100dvh;
      margin: auto;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #252536;
      border-right: 1px solid #252536;
    }

    header {
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #252536;
    }

    .logo {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: linear-gradient(135deg, #8b5cf6, #4338ca);
      font-size: 23px;
      font-weight: bold;
    }

    header h1 {
      font-size: 20px;
      margin: 0 0 5px;
    }

    header p {
      font-size: 12px;
      color: #aaa9bd;
      margin: 0;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 18px;
    }

    .welcome {
      text-align: center;
      margin: 12vh auto 35px;
    }

    .welcome .spark {
      font-size: 44px;
    }

    .welcome h2 {
      font-size: clamp(25px, 5vw, 35px);
      margin: 16px 0 10px;
    }

    .welcome p {
      color: #aaa9bd;
      line-height: 1.6;
    }

    .message {
      max-width: 82%;
      width: fit-content;
      padding: 13px 16px;
      margin: 14px 0;
      border-radius: 17px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      margin-left: auto;
      background: #5738a8;
      border-bottom-right-radius: 5px;
    }

    .assistant {
      background: #181824;
      border: 1px solid #29293a;
      border-bottom-left-radius: 5px;
    }

    .composer {
      padding: 15px;
      border-top: 1px solid #252536;
      background: #0d0d15;
    }

    form {
      display: flex;
      gap: 10px;
      padding: 8px;
      border: 1px solid #333348;
      border-radius: 17px;
      background: #171722;
    }

    textarea {
      flex: 1;
      min-width: 0;
      resize: none;
      border: 0;
      outline: 0;
      color: white;
      background: transparent;
      font: inherit;
      padding: 10px;
      max-height: 120px;
    }

    button {
      border: 0;
      cursor: pointer;
      border-radius: 12px;
      color: white;
      background: #7550df;
      padding: 0 17px;
      font-weight: bold;
    }

    button:hover { background: #8969ef; }
    button:disabled { opacity: .5; cursor: wait; }

    .note {
      text-align: center;
      font-size: 11px;
      color: #88889b;
      margin: 10px 0 0;
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="logo">V</div>
      <div>
        <h1>Vix AI</h1>
        <p>Sua assistente inteligente</p>
      </div>
    </header>

    <main id="chat" aria-live="polite">
      <div class="welcome" id="welcome">
        <div class="spark">✦</div>
        <h2>Como posso ajudar?</h2>
        <p>Faça uma pergunta e comece uma conversa.</p>
      </div>
    </main>

    <div class="composer">
      <form id="form">
        <textarea id="input" rows="1"
          placeholder="Escreva sua mensagem..."
          aria-label="Sua mensagem" required></textarea>
        <button id="send" type="submit">Enviar</button>
      </form>
      <p class="note">Vix AI · Primeira versão em desenvolvimento</p>
    </div>
  </div>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");
    const send = document.getElementById("send");

    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = "message " + type;
      message.textContent = text;
      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
      return message;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const question = input.value.trim();
      if (!question || send.disabled) return;

      document.getElementById("welcome")?.remove();
      addMessage(question, "user");
      input.value = "";
      send.disabled = true;

      const answer = addMessage("A interface está funcionando! No próximo passo, vamos conectar a IA real.", "assistant");

      send.disabled = false;
      input.focus();
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
