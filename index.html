
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090f">
  <title>Vix AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #09090f;
      color: #f5f5f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 20px;
      border-bottom: 1px solid #252532;
      background: #101019;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #8b5cf6, #2563eb);
      display: grid;
      place-items: center;
      font-weight: bold;
      font-size: 21px;
    }

    header h1 {
      margin: 0;
      font-size: 21px;
    }

    header p {
      margin: 4px 0 0;
      color: #a1a1b5;
      font-size: 12px;
    }

    #chat {
      flex: 1;
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      padding: 24px 16px 120px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #welcome {
      text-align: center;
      margin: auto 0;
      padding: 55px 10px;
    }

    #welcome h2 {
      font-size: clamp(27px, 5vw, 42px);
      margin-bottom: 12px;
    }

    #welcome p {
      color: #a1a1b5;
      line-height: 1.6;
    }

    .message {
      max-width: 85%;
      padding: 14px 17px;
      border-radius: 17px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      align-self: flex-end;
      background: #3730a3;
      border-bottom-right-radius: 5px;
    }

    .assistant {
      align-self: flex-start;
      background: #191923;
      border: 1px solid #2b2b39;
      border-bottom-left-radius: 5px;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 16px;
      background: linear-gradient(transparent, #09090f 20%);
    }

    form {
      max-width: 850px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      padding: 9px;
      border: 1px solid #343444;
      border-radius: 18px;
      background: #15151f;
    }

    textarea {
      flex: 1;
      min-width: 0;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 16px;
      padding: 12px;
      font-family: inherit;
    }

    button {
      border: 0;
      border-radius: 12px;
      background: #6d4aff;
      color: white;
      padding: 0 19px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .notice {
      text-align: center;
      color: #77778b;
      font-size: 11px;
      margin: 9px 0 0;
    }

    @media (max-width: 480px) {
      header {
        padding: 14px;
      }

      #chat {
        padding: 18px 12px 120px;
      }

      .message {
        max-width: 94%;
      }

      footer {
        padding: 10px;
      }

      button {
        padding: 0 14px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">V</div>
    <div>
      <h1>Vix AI</h1>
      <p>Sua inteligência artificial</p>
    </div>
  </header>

  <main id="chat">
    <section id="welcome">
      <h2>Olá! Eu sou a Vix AI 👋</h2>
      <p>Como posso ajudar você hoje?</p>
    </section>
  </main>

  <footer>
    <form id="form">
      <textarea
        id="input"
        rows="1"
        maxlength="4000"
        placeholder="Pergunte alguma coisa..."
        aria-label="Digite sua mensagem"
        required
      ></textarea>
      <button id="send" type="submit">Enviar</button>
    </form>
    <p class="notice">Vix AI pode cometer erros. Confira informações importantes.</p>
  </footer>

  <script>
    const API_URL = "https://vix-ai-server.onrender.com";

    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");
    const send = document.getElementById("send");

    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = "message " + type;
      message.textContent = text;
      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
      return message;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const question = input.value.trim();

      if (!question || send.disabled) return;

      document.getElementById("welcome")?.remove();

      addMessage(question, "user");
      input.value = "";
      send.disabled = true;

      const answer = addMessage("Pensando...", "assistant");

      try {
        const response = await fetch(`${API_URL}/api/chat`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: question
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Erro ao consultar a IA.");
        }

        answer.textContent =
          data.reply || "A IA não retornou uma resposta.";
      } catch (error) {
        console.error("Erro na Vix AI:", error);
        answer.textContent =
          "Não consegui conectar à IA. Confira o servidor e tente novamente.";
      } finally {
        send.disabled = false;
        input.focus();
      }
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
